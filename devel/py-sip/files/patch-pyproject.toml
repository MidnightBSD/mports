Keep the runtime floor at the public setuptools version; the full upstream
test suite builds generated bindings successfully with setuptools 63.1.0. The
PEP 517 build backend retains the upstream >=77 requirement.

--- pyproject.toml.orig	2025-12-06 11:51:43 UTC
+++ pyproject.toml
@@ -12,7 +12,7 @@ urls.homepage = "https://github.com/Python-SIP/sip"
 description = "A Python bindings generator for C/C++ libraries"
 readme = "README.md"
 urls.homepage = "https://github.com/Python-SIP/sip"
-dependencies = ["packaging>=24.2", "setuptools>=75.8.1", "tomli; python_version<'3.11'"]
+dependencies = ["packaging>=24.2", "setuptools>=63.1.0", "tomli; python_version<'3.11'"]
 requires-python = ">=3.10"
 license = "BSD-2-Clause"
 license-files = ["LICENSE"]
