Allow protobuf 7 after the full upstream suite passed with mports protobuf 7.36.2.
Retain upstream security exclusions; the port dependency floor excludes those versions.

--- pyproject.toml.orig	2026-10-10 04:34:09 UTC
+++ pyproject.toml
@@ -26,7 +26,7 @@ dependencies = [
     "google-auth~=2.0",
     # Exclude vulnerable protobuf versions: [,4.25.8), [5.26.0rc1, 5.29.5), [6.30.0rc1, 6.31.1)
     # https://security.snyk.io/vuln/SNYK-PYTHON-PROTOBUF-10364902
-    "protobuf>=4.25.8,!=5.26.*,!=5.27.*,!=5.28.*,!=5.29.0,!=5.29.1,!=5.29.2,!=5.29.3,!=5.29.4,!=6.30.0,!=6.30.1,!=6.31.0,<7.0",
