name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number
      focus:
        description: "Optional focus area (e.g. 'security', 'correctness', 'Makefile conventions')"
        required: false
        type: string
        default: ""

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review (automatic)
        id: review
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are reviewing a pull request for the MidnightBSD mports ports tree.

            Review the diff for:
            1. Correctness — Makefile syntax, correct DISTVERSION/DISTNAME, valid USES keywords, proper patch file naming (patch-* convention), correct LICENSE identifiers (e.g. bsd3, mit, Apache-2.0), no WWW line in pkg-descr.
            2. PORTREVISION bumps — required when shared library versions change in dependencies.
            3. pkg-plist completeness — staged files match plist entries; @dir for new directories; @sample for .sample files; fc-cache postexec for x11-fonts ports.
            4. Security — no embedded credentials, safe fetch URLs, no command injection in scripts.
            5. Compatibility — patches must not drop ARM, RISC-V, MIPS, or WebAssembly support; no sparc64/powerpc-only code added.

            Post inline comments on specific lines where issues are found. Summarize overall verdict at the end.

      # The action hides Claude's output for safety, so a session that ends with
      # is_error:true and zero turns leaves no clue in the log (for example a
      # rejected token or a subscription usage limit, both of which surface only
      # as api_error_status on the result record). Print just the status fields
      # and a short, redacted excerpt of the result text.
      - name: Explain Claude review failure
        if: failure() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          path = os.environ["EXECUTION_FILE"]
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"::warning::could not parse {path}: {e}")
              raise SystemExit(0)
          msgs = data if isinstance(data, list) else [data]
          for m in msgs:
              if m.get("type") != "result":
                  continue
              fields = {k: m.get(k) for k in ("subtype", "is_error", "num_turns",
                        "duration_ms", "total_cost_usd", "api_error_status",
                        "api_retry_statuses", "errors", "permission_denials_count")}
              print("claude result:", json.dumps(fields))
              text = str(m.get("result") or "")[:300]
              text = re.sub(r"(sk-ant-[A-Za-z0-9_-]+|gh[pousr]_[A-Za-z0-9]+)", "[redacted]", text)
              print("result text (first 300 chars):", text)
          EOF

      - name: Claude Code Review (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.inputs.pr_number }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are reviewing a pull request for the MidnightBSD mports ports tree.
            ${{ github.event.inputs.focus != '' && format('Focus especially on: {0}', github.event.inputs.focus) || '' }}

            Review the diff for:
            1. Correctness — Makefile syntax, correct DISTVERSION/DISTNAME, valid USES keywords, proper patch file naming (patch-* convention), correct LICENSE identifiers (e.g. bsd3, mit, Apache-2.0), no WWW line in pkg-descr.
            2. PORTREVISION bumps — required when shared library versions change in dependencies.
            3. pkg-plist completeness — staged files match plist entries; @dir for new directories; @sample for .sample files; fc-cache postexec for x11-fonts ports.
            4. Security — no embedded credentials, safe fetch URLs, no command injection in scripts.
            5. Compatibility — patches must not drop ARM, RISC-V, MIPS, or WebAssembly support; no sparc64/powerpc-only code added.

            Post inline comments on specific lines where issues are found. Summarize overall verdict at the end.
